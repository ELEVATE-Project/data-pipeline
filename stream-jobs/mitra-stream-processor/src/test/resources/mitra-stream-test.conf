include "base-test.conf"

kafka {
  groupId = "mitra_sg_voices_group"
  input {
    discussion.topic = "sg_discussion_event_dev"
    discussion.enabled = true
    story.topic  = "sg_stories_event_dev"
    story.enabled = true
  }
  output {
    discussion.topic = "sg_discussion_dashboard_dev"
    story.topic  = "sg_discussion_dashboard_dev"
  }
  consumer {
    discussion.group = "discussion-consumer-group-dev"
    story.group  = "story-consumer-group-dev"
  }
}

task {
  discussion {
    consumer.parallelism = 1
    process.parallelism = 1
    sink.parallelism = 1
  }
  story {
    consumer.parallelism = 1
    process.parallelism = 1
    sink.parallelism = 1
  }
}

test.mode = true

postgres{
  host = "localhost"
  port = "5432"
  username = "postgres"
  password = "postgres"
  database = "mitra-test"
  tables = {
    promptsTable = "prompts"
    promptsVersionsTable = "prompt_version"
    themesTable = "themes"
    discussionsTable = "discussions_meta"
    storiesMetaTable = "stories_meta"
    voicesTable = "voices"
    storiesTable = "stories"
    feedsTable = "feeds"
  }
}

ai.model.provider = "claude"

gemini {
  api.url = "https://api.openai.com/v1/chat/completions"
  api.key = "your_api_key_here"
  model.name = "gemini-2.5-flash"
  model.temperature = 0.0
  model.max.tokens = 4000
}

bedrock {
  model.version = "bedrock-2023-05-31"
  model.id = "global.anthropic.claude-sonnet-4-5-20250929-v1:0"
  model.temperature = 0.0
  model.max.tokens = 4000
}

# AWS Configuration
aws {
  region = "ap-south-1"
  access.key = "your_access_key_here"
  secret.key = "your_secret_key_here"
}

# Cloud Storage Configuration
cloud.storage {
  provider = "gcp" # Options: "s3", "gcp", "oracle"
  bucket.name = "dev-sg-dashboard"
  region = "us-central1"
  make.public = true
}

# GCP Specific Configuration
gcp {
  project.id = "dev-sg-dashboard"
  credentials.path = "/Users/user/Documents/shikshalokam/elevate-analytics/dev/data-pipeline/stream-jobs/mitra-stream-processor/src/test/resources/gcp.json"
}

base.url = "https://mohini-static.shikshalokam.org/chatbot/storymedia"