include "base-test.conf"

kafka {
  groupId = "dummy-unified-group"
  input {
    discussion.topic = "sl-improvement-discussion-submission-prod"
    discussion.enabled = true
    story.topic  = "sl-improvement-story-submission-prod"
    story.enabled = true
  }
  output {
    discussion.topic = "sl-metabase-discussion-dashboard-prod"
    story.topic  = "sl-metabase-story-dashboard-prod"
  }
  consumer {
    discussion.group = "sl-improvement-discussion-consumer-group-prod"
    story.group  = "elevate-story-raw-consumer-group-prod"
  }
}

task {
  discussion {
    consumer.parallelism = 1
    process.parallelism = 1
    sink.parallelism = 1
  }
  story {
    consumer.parallelism = 1
    process.parallelism = 1
    sink.parallelism = 1
  }

}

test.mode = true

postgres{
  host = "localhost"
  port = "5432"
  username = "postgres"
  password = "postgres"
  database = "mitra"
  tables = {
    promptsTable = "prompts"
    promptsVersionsTable = "prompt_version"
    themesTable = "themes"
    discussionsTable = "discussions_meta"
    voicesTable = "voices"
    storiesTable = "stories"
    feedsTable = "feeds"
  }
}

ai.model.provider = "claude"

gemini {
  api.url = "https://api.openai.com/v1/chat/completions"
  api.key = "your_api_key_here"
  model.name = "gemini-2.5-flash"
  model.temperature = 0.0
  model.max.tokens = 4000
}

bedrock {
  model.version = "bedrock-2023-05-31"
  model.id = "global.anthropic.claude-sonnet-4-5-20250929-v1:0"
  model.temperature = 0.0
  model.max.tokens = 4000
}

aws {
  region = "ap-south-1"
  access.key = "your_access_key_here"
  secret.key = "your_secret_key_here"
}