rootLogger.level = INFO
rootLogger.appenderRef.console.ref = ConsoleAppender
rootLogger.appenderRef.rolling.ref = RollingFileAppender

# Console Appender
appender.console.name = ConsoleAppender
appender.console.type = CONSOLE
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n

# Main Rolling File Appender (for everything else)
appender.rolling.name = RollingFileAppender
appender.rolling.type = RollingFile
appender.rolling.fileName = ${sys:log.file}
appender.rolling.filePattern = ${sys:log.file}.%i
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n
appender.rolling.policies.type = Policies
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size = 100MB
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = 10

# discussion Stream Appender
appender.discussion.name = DiscussionFileAppender
appender.discussion.type = RollingFile
appender.discussion.fileName = logs/discussion-stream.log
appender.discussion.filePattern = logs/discussion-stream-%d{yyyy-MM-dd}.log.gz
appender.discussion.layout.type = PatternLayout
appender.discussion.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n
appender.discussion.policies.type = Policies
appender.discussion.policies.time.type = TimeBasedTriggeringPolicy
appender.discussion.policies.time.interval = 1
appender.discussion.policies.time.modulate = true
appender.discussion.strategy.type = DefaultRolloverStrategy
appender.discussion.strategy.delete.type = Delete
appender.discussion.strategy.delete.basePath = logs
appender.discussion.strategy.delete.maxDepth = 1
appender.discussion.strategy.delete.ifLastModified.type = IfLastModified
appender.discussion.strategy.delete.ifLastModified.age = 7d

# story Stream Appender
appender.story.name = StoryFileAppender
appender.story.type = RollingFile
appender.story.fileName = logs/story-stream.log
appender.story.filePattern = logs/story-stream-%d{yyyy-MM-dd}.log.gz
appender.story.layout.type = PatternLayout
appender.story.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n
appender.story.policies.type = Policies
appender.story.policies.time.type = TimeBasedTriggeringPolicy
appender.story.policies.time.interval = 1
appender.story.policies.time.modulate = true
appender.story.strategy.type = DefaultRolloverStrategy
appender.story.strategy.delete.type = Delete
appender.story.strategy.delete.basePath = logs
appender.story.strategy.delete.maxDepth = 1
appender.story.strategy.delete.ifLastModified.type = IfLastModified
appender.story.strategy.delete.ifLastModified.age = 7d

# Logger for discussion Stream
logger.discussion.name = org.shikshalokam.job.combined.stream.processor.functions.DiscussionStreamFunction
logger.discussion.level = INFO
logger.discussion.additivity = false
logger.discussion.appenderRef.discussion.ref = DiscussionFileAppender

# Logger for story Stream
logger.story.name = org.shikshalokam.job.combined.stream.processor.functions.StoryStreamFunction
logger.story.level = INFO
logger.story.additivity = false
logger.story.appenderRef.story.ref = StoryFileAppender
