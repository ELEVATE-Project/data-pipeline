rootLogger.level = INFO
rootLogger.appenderRef.console.ref = ConsoleAppender
rootLogger.appenderRef.rolling.ref = RollingFileAppender

# Console Appender
appender.console.name = ConsoleAppender
appender.console.type = CONSOLE
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n

# Main Rolling File Appender (for everything else)
appender.rolling.name = RollingFileAppender
appender.rolling.type = RollingFile
appender.rolling.fileName = ${sys:log.file}
appender.rolling.filePattern = ${sys:log.file}.%i
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n
appender.rolling.policies.type = Policies
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size = 100MB
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = 10

# Project Stream Appender
appender.project.name = ProjectFileAppender
appender.project.type = RollingFile
appender.project.fileName = logs/project-stream.log
appender.project.filePattern = logs/project-stream-%d{yyyy-MM-dd}.log.gz
appender.project.layout.type = PatternLayout
appender.project.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n
appender.project.policies.type = Policies
appender.project.policies.time.type = TimeBasedTriggeringPolicy
appender.project.policies.time.interval = 1
appender.project.policies.time.modulate = true
appender.project.strategy.type = DefaultRolloverStrategy
appender.project.strategy.delete.type = Delete
appender.project.strategy.delete.basePath = logs
appender.project.strategy.delete.maxDepth = 1
appender.project.strategy.delete.ifLastModified.type = IfLastModified
appender.project.strategy.delete.ifLastModified.age = 7d

# Survey Stream Appender
appender.survey.name = SurveyFileAppender
appender.survey.type = RollingFile
appender.survey.fileName = logs/survey-stream.log
appender.survey.filePattern = logs/survey-stream-%d{yyyy-MM-dd}.log.gz
appender.survey.layout.type = PatternLayout
appender.survey.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n
appender.survey.policies.type = Policies
appender.survey.policies.time.type = TimeBasedTriggeringPolicy
appender.survey.policies.time.interval = 1
appender.survey.policies.time.modulate = true
appender.survey.strategy.type = DefaultRolloverStrategy
appender.survey.strategy.delete.type = Delete
appender.survey.strategy.delete.basePath = logs
appender.survey.strategy.delete.maxDepth = 1
appender.survey.strategy.delete.ifLastModified.type = IfLastModified
appender.survey.strategy.delete.ifLastModified.age = 7d

# Observation Stream Appender
appender.observation.name = ObservationFileAppender
appender.observation.type = RollingFile
appender.observation.fileName = logs/observation-stream.log
appender.observation.filePattern = logs/observation-stream-%d{yyyy-MM-dd}.log.gz
appender.observation.layout.type = PatternLayout
appender.observation.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n
appender.observation.policies.type = Policies
appender.observation.policies.time.type = TimeBasedTriggeringPolicy
appender.observation.policies.time.interval = 1
appender.observation.policies.time.modulate = true
appender.observation.strategy.type = DefaultRolloverStrategy
appender.observation.strategy.delete.type = Delete
appender.observation.strategy.delete.basePath = logs
appender.observation.strategy.delete.maxDepth = 1
appender.observation.strategy.delete.ifLastModified.type = IfLastModified
appender.observation.strategy.delete.ifLastModified.age = 7d

# User Stream Appender
appender.user.name = UserFileAppender
appender.user.type = RollingFile
appender.user.fileName = logs/user-stream.log
appender.user.filePattern = logs/user-stream-%d{yyyy-MM-dd}.log.gz
appender.user.layout.type = PatternLayout
appender.user.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n
appender.user.policies.type = Policies
appender.user.policies.time.type = TimeBasedTriggeringPolicy
appender.user.policies.time.interval = 1
appender.user.policies.time.modulate = true
appender.user.strategy.type = DefaultRolloverStrategy
appender.user.strategy.delete.type = Delete
appender.user.strategy.delete.basePath = logs
appender.user.strategy.delete.maxDepth = 1
appender.user.strategy.delete.ifLastModified.type = IfLastModified
appender.user.strategy.delete.ifLastModified.age = 7d

# Logger for Project Stream
logger.project.name = org.shikshalokam.job.combined.stream.processor.functions.ProjectStreamFunction
logger.project.level = INFO
logger.project.additivity = false
logger.project.appenderRef.project.ref = ProjectFileAppender

# Logger for Survey Stream
logger.survey.name = org.shikshalokam.job.combined.stream.processor.functions.SurveyStreamFunction
logger.survey.level = INFO
logger.survey.additivity = false
logger.survey.appenderRef.survey.ref = SurveyFileAppender

# Logger for Observation Stream
logger.observation.name = org.shikshalokam.job.combined.stream.processor.functions.ObservationStreamFunction
logger.observation.level = INFO
logger.observation.appenderRef.observation.ref = ObservationFileAppender
logger.observation.additivity = false

# Logger for User Stream
logger.user.name = org.shikshalokam.job.combined.stream.processor.functions.UserStreamFunction
logger.user.level = INFO
logger.user.appenderRef.user.ref = UserFileAppender
logger.user.additivity = false
