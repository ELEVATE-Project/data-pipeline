include "base-config.conf"

akka.http.host = "localhost"
akka.http.port = 8080
akka.server.request-timeout = 60s
akka.server.idle-timeout = 60s

file.sinkDirectory = "/Users/user/Documents/shikshalokam/elevate-analytics/dev/data-pipeline/csv"

postgres{
  host = "localhost"
  port = "5432"
  username = "postgres"
  password = "elevatedata"
  database = "dev-project-analytics"
  tables = {
    projectsTable = ${job.env}"_projects"
  }
}

metabase {
  url = "http://localhost:3000/api"
  username = "metabase-username"
  password = "metabase-password"
  database = "ElevateData"
}

security {
  api-token = "{your-api-token}"
}

services {
  flink {
    rest-api-url = "https://flink-qa.tekdinext.com"
    jobs = [
      "MetabaseProjectDashboardJob",
      "ProjectsStreamJob",
      "SurveysStreamJob",
      "MetabaseSurveyDashboardJob",
      "UserAndProgramManagement",
      "ObservationsStreamJob",
      "MetabaseObservationDashboardJob",
      "UsersStreamJob",
      "MentoringStreamJob",
      "MetabaseUserDashboardJob",
      "MetabaseMentoringDashboardJob"
    ]
  }

  kafka {
    broker-list = "localhost:9093"
  }

  metabase {
    url = "https://qa.elevate.metabase.shikshalokam.org"
  }
}

# Dedicated dispatcher for blocking I/O operations (Kafka, etc.)
blocking-io-dispatcher {
  type = Dispatcher
  executor = "thread-pool-executor"
  thread-pool-executor {
    fixed-pool-size = 4
  }
  throughput = 1
}