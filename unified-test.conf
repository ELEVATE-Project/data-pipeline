# Unified Test Configuration
# Mirrors unified-pipeline.conf structure with test/local values.
# Tests load this via test/resources/test.conf (which includes it)
# and apply the same namespace extraction:
#   stream.*   → UnifiedStreamConfig
#   dashboard.* → CombinedDashboardCreatorConfig

kafka {
  broker-servers = "localhost:9092"
  zookeeper = "localhost:2181"
  groupId = "test-consumer-group"
  auto.offset.reset = "earliest"
  producer {
    max-request-size = 102400
  }
}

job {
  env = "local"
  bb = "elevate"
  enable.distributed.checkpointing = false
  statebackend {
    blob {
      storage {
        account = "blob.storage.account"
        container = "kp-checkpoints"
        checkpointing.dir = "flink-jobs"
      }
    }
    base.url = "file:///opt/flink/checkpoints"
  }
}

postgres {
  host = "localhost"
  port = "5432"
  username = "postgres"
  password = "postgres"
  database = "test"
  metabaseDb = "metabase"
  tables = {
    solutionsTable = ${job.env}"_solutions"
    projectsTable = ${job.env}"_projects"
    tasksTable = ${job.env}"_tasks"
    dashboardMetadataTable = ${job.env}"_dashboard_metadata"
    reportConfigTable = ${job.env}"_report_config"
    userMetrics = ${job.env}"_user_metrics"
    userMetricsTable = ${job.env}"_user_metrics"
  }
}

# Stream Processor Test Overrides
stream {
  test.mode = true
  reports {
    enabled = ["admin", "state", "district", "program", "solution"]
  }

  kafka {
    input {
      project { enabled = true, topic = "sl-improvement-project-submission-prod" }
      survey { enabled = true, topic  = "elevate_surveys_raw_prod" }
      observation { enabled = true, topic = "sl-improvement-observation-submission-prod" }
      user { enabled = true, topic = "sl-improvement-user-submission-prod" }
      mentoring { enabled = true, topic = "sl-improvement-mentoring-submission-prod" }
    }
    output {
      project.topic = "sl-metabase-project-dashboard-prod"
      survey.topic  = "sl-metabase-survey-dashboard-prod"
      observation.topic = "sl-metabase-observation-dashboard-prod"
      user.topic = "sl-metabase-user-dashboard-prod"
      mentoring.topic = "sl-metabase-mentoring-dashboard-prod"
    }
    consumer {
      project.group = "sl-improvement-project-consumer-group-prod"
      survey.group  = "elevate-survey-raw-consumer-group-prod"
      observation.group = "sl-improvement-observation-consumer-group-prod"
      user.group = "sl-improvement-user-consumer-group-prod"
      mentoring.group = "sl-improvement-mentoring-consumer-group-prod"
    }
  }

  task {
    checkpointing.compressed = true
    checkpointing.pause.between.seconds = 30000
    parallelism = 1
    checkpointing.interval = 60000
    restart-strategy {
      attempts = 1
      delay = 10000
    }
    consumer.parallelism = 1

    project { consumer.parallelism = 1, process.parallelism = 1, sink.parallelism = 1 }
    survey { consumer.parallelism = 1, process.parallelism = 1, sink.parallelism = 1 }
    observation { consumer.parallelism = 1, process.parallelism = 1, sink.parallelism = 1 }
    user { consumer.parallelism = 1, process.parallelism = 1, sink.parallelism = 1 }
    mentoring { consumer.parallelism = 1, process.parallelism = 1, sink.parallelism = 1 }
  }
}

# Dashboard Creator Test Overrides
dashboard {
  kafka {
    groupId = "combined-dashboard-creator-group"
    input {
      project { enabled = true, topic = "sl-metabase-project-dashboard-dev" }
      survey { enabled = true, topic = "sl-metabase-survey-dashboard-dev" }
      observation { enabled = true, topic = "sl-metabase-observation-dashboard-dev" }
      user { enabled = true, topic = "sl-metabase-user-dashboard-dev" }
      userservice { enabled = true, topic = "dev.userCreate" }
      programservice { enabled = true, topic = "dev.programPush" }
      mentoring { enabled = true, topic = "sl-metabase-mentoring-dashboard-dev" }
    }
    output {
      notification.topic = "develop.notifications"
    }
    consumer {
      project.group = "sl-metabase-project-consumer-group-dev"
      survey.group = "sl-metabase-survey-consumer-group-dev"
      observation.group = "sl-metabase-observation-consumer-group-dev"
      user.group = "sl-metabase-user-consumer-group-dev"
      mentoring.group = "sl-metabase-mentoring-consumer-group-dev"
      userservice.group = "sl-metabase-userservice-consumer-group-dev"
      programservice.group = "sl-metabase-programservice-consumer-group-dev"
    }
  }

  task {
    checkpointing.compressed = true
    checkpointing.pause.between.seconds = 30000
    parallelism = 1
    checkpointing.interval = 60000
    restart-strategy {
      attempts = 1
      delay = 10000
    }
    consumer.parallelism = 1

    project { consumer.parallelism = 1, process.parallelism = 1 }
    survey { consumer.parallelism = 1, process.parallelism = 1 }
    observation { consumer.parallelism = 1, process.parallelism = 1 }
    user { consumer.parallelism = 1, process.parallelism = 1 }
    notification { producer.parallelism = 1 }
    userservice { consumer.parallelism = 1, process.parallelism = 1 }
    programservice { consumer.parallelism = 1, process.parallelism = 1 }
    mentoring { consumer.parallelism = 1, process.parallelism = 1 }
  }

  metabase {
    url = "http://localhost:3000/api"
    username = "vivek@shikshalokam.org"
    password = "Test@1234"
    database = "test"
    domainName = "http://localhost:3000/dashboard/"
    metabaseApiKey = "5a926918-66e9-4370-ae3f-b4dd9a27d52a"
    evidenceBaseUrl = "https://elevate-api.sunbirdsaas.com/project/v1/cloud-services/files/download?file="
  }

  domain {
    name = "@elevate-saas.com"
  }

  notify {
    type = "api"
    api.url = "https://interface.tekdinext.com/interface/v1/notification/send-raw"
    email.template = """
      {
        "email": {
          "to": ["{email}"],
          "subject": "Welcome to Metabase Analytics Platform",
          "body": "<p>Dear {name},</p><p>Please find the URL and login credentials for Metabase.</p><p>URL: <a href=\"{dashboardLink}\">Click here to access Metabase</a></p><p>Username: {email}</p><p>Password: {password}</p>"
