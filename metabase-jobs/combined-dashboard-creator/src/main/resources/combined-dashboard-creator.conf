include "base-config.conf"

kafka {
  input {
    project {
      enabled = true
      topic = "sl-metabase-project-dashboard-dev"
    }
    survey {
      enabled = true
      topic = "sl-metabase-survey-dashboard-dev"
    }
    observation {
      enabled = true
      topic = "sl-metabase-observation-dashboard-dev"
    }
    user {
      enabled = true
      topic = "sl-metabase-user-dashboard-dev"
    }
    userservice {
      enabled = true
      topic = "dev.userCreate"
    }
    programservice {
      enabled = true
      topic = "dev.programPush"
    }
    mentoring {
      enabled = true
      topic = "sl-metabase-mentoring-dashboard-dev"
    }
  }
  output {
    notification.topic = "develop.notifications"
  }
  consumer{
    project.group = "sl-metabase-project-consumer-group-dev"
    survey.group = "sl-metabase-survey-consumer-group-dev"
    observation.group = "sl-metabase-observation-consumer-group-dev"
    user.group = "sl-metabase-user-consumer-group-dev"
    mentoring.group = "sl-metabase-mentoring-consumer-group-dev"
    userservice.group = "sl-metabase-userservice-consumer-group-dev"
    programservice.group = "sl-metabase-programservice-consumer-group-dev"
  }
}

task {
  project {
    consumer.parallelism = 1
    process.parallelism = 1
  }
  survey {
    consumer.parallelism = 1
    process.parallelism = 1
  }
  observation {
    consumer.parallelism = 1
    process.parallelism = 1
  }
  user {
    consumer.parallelism = 1
    process.parallelism = 1
  }
  notification {
    producer.parallelism = 1
  }
  userservice {
    consumer.parallelism = 1
    process.parallelism = 1
  }
  programservice {
    consumer.parallelism = 1
    process.parallelism = 1
  }
  mentoring {
    consumer.parallelism = 1
    process.parallelism = 1
  }
}

postgres {
  host = "localhost"
  port = "5432"
  username = "postgres"
  password = "postgres"
  database = "test"
  metabaseDb = "metabase"
  tables {
    solutionsTable = ${job.env}"_solutions"
    projectsTable = ${job.env}"_projects"
    tasksTable = ${job.env}"_tasks"
    dashboardMetadataTable = ${job.env}"_dashboard_metadata"
    reportConfigTable = ${job.env}"_report_config"
    userMetricsTable = ${job.env}"_user_metrics"
  }
}

