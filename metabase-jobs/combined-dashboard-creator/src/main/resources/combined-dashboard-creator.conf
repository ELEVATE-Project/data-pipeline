include "base-config.conf"

kafka {
  input {
    mentoring {
      enabled = true
      topic = "sl-metabase-mentoring-dashboard-dev"
    }
    observation {
      enabled = true
      topic = "sl-metabase-observation-dashboard-dev"
    }
    project {
      enabled = true
      topic = "sl-metabase-project-dashboard-dev"
    }
    survey {
      enabled = true
      topic = "sl-metabase-survey-dashboard-dev"
    }
    user {
      enabled = true
      topic = "sl-metabase-user-dashboard-dev"
    }
    userservice {
      enabled = true
      topic = "dev.userCreate"
    }
    programservice {
      enabled = true
      topic = "dev.programPush"
    }
  }
  output.notification.topic = "develop.notifications"
  groupId = "sl-combined-dashboard-consumer-group-dev"
}

task {
  sl.metabase.dashboard.parallelism = 1
}

postgres {
  host = "localhost"
  port = "5432"
  username = "postgres"
  password = "postgres"
  database = "test"
  metabaseDb = "metabase"
  tables {
    solutionsTable = ${job.env}"_solutions"
    projectsTable = ${job.env}"_projects"
    tasksTable = ${job.env}"_tasks"
    dashboardMetadataTable = ${job.env}"_dashboard_metadata"
    reportConfigTable = ${job.env}"_report_config"
    userMetricsTable = ${job.env}"_user_metrics"
  }
}

metabase {
  url = "http://localhost:3000/api"
  username = "vivek@shikshalokam.org"
  password = "Test@1234"
  database = "test"
  domainName = "http://localhost:3000/dashboard/"
  metabaseApiKey = "d3f4ult-api-key"
  evidenceBaseUrl = "https://elevate-api.sunbirdsaas.com/project/v1/cloud-services/files/download?file="
}

domain {
  name = "@elevate-saas.com"
}

notify {
  type = "api"
  api.url = "https://saas-qa-interface.tekdinext.com/interface/v1/notification/send-raw"
  email.template = """
    {
      "email": {
        "to": ["{email}"],
        "subject": "Welcome to Metabase Analytics Platform",
        "body": "<p>Dear {name},</p><p>Please find the URL and login credentials for Metabase.</p><p>URL: <a href=\"{dashboardLink}\">Click here to access Metabase</a></p><p>Username: {email}</p><p>Password: {password}</p>"
      }
    }
  """
  sms.template = """
    {
      "sms": {
        "to": ["{mobile}"],
        "body": "Dear {name},\nPlease find the URL and login credentials for Metabase.\nURL: {dashboardLink}\nUsername: {email}\nPassword: {password}"
      }
    }
  """
}
